<title>SY COMPANY 자료실</title>
<style>
:root{
  --ground:#EBEBF0; --panel:#FFFFFF; --panel-2:#F5F5F9;
  --ink:#1B1B23; --muted:#6C6C7E; --faint:#9A9AAC;
  --line:#D6D6E0; --line-soft:#E6E6EE;
  --accent:#4A4FA0; --accent-soft:#E7E7F4;
  --st-done:#3FBE9A; --st-work:#E6B41F; --st-appr:#E0559A; --st-link:#9B8AE0;
  --shadow:0 1px 2px rgba(20,20,35,.06),0 8px 24px rgba(20,20,35,.07);
  --sans:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131319; --panel:#1C1C25; --panel-2:#22222D;
    --ink:#E9E9F1; --muted:#9A9AAE; --faint:#6E6E82;
    --line:#2F2F3D; --line-soft:#272733;
    --accent:#8C90E8; --accent-soft:#2A2A44;
    --st-done:#5FD3B0; --st-work:#F2C744; --st-appr:#F06AAC; --st-link:#B0A0F0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#131319; --panel:#1C1C25; --panel-2:#22222D;
  --ink:#E9E9F1; --muted:#9A9AAE; --faint:#6E6E82;
  --line:#2F2F3D; --line-soft:#272733;
  --accent:#8C90E8; --accent-soft:#2A2A44;
  --st-done:#5FD3B0; --st-work:#F2C744; --st-appr:#F06AAC; --st-link:#B0A0F0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px; margin:0 auto; padding:22px 20px 48px; display:flex; flex-direction:column; gap:18px}

.masthead{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:14px}
.brand .eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); display:block; margin-bottom:3px}
.brand h1{margin:0; font-size:21px; font-weight:650; letter-spacing:-.01em}
.masthead .meta{font-family:var(--mono); font-size:11px; color:var(--muted); text-align:right}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:11px 13px; box-shadow:var(--shadow)}
.stat .k{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
.stat .v{font-family:var(--mono); font-size:23px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:3px}
.stat .v small{font-size:12px; font-weight:400; color:var(--muted); margin-left:3px}

.card{background:var(--panel); border:1px solid var(--line); border-radius:3px;
  box-shadow:var(--shadow); padding:15px 16px}
.card > h2{margin:0 0 12px; font-family:var(--mono); font-size:10.5px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--faint); font-weight:600}

.browser{display:grid; grid-template-columns:320px minmax(0,1fr); gap:14px; align-items:start}
@media (max-width:900px){ .browser{grid-template-columns:minmax(0,1fr)} }

.tree{max-height:560px; overflow-y:auto; padding-right:4px}
.tteam{border-bottom:1px solid var(--line-soft); padding:2px 0}
.tteam:last-child{border-bottom:0}
.trow{display:flex; align-items:center; gap:7px; width:100%; text-align:left; background:none;
  border:0; padding:6px 4px; cursor:pointer; color:var(--ink); font-family:var(--sans); font-size:13px; border-radius:2px}
.trow:hover{background:var(--panel-2)}
.trow:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.trow .car{font-family:var(--mono); font-size:9px; color:var(--faint); width:9px; flex:none}
.trow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.trow .ct{font-family:var(--mono); font-size:10.5px; color:var(--faint); font-variant-numeric:tabular-nums}
.tteam > .trow{font-weight:650}
.tmem{padding-left:16px}
.tmem .trow{font-size:12.5px}
.tmem .role{color:var(--faint); font-size:11px; margin-left:5px}
.tdoc{padding-left:32px}
.tdoc button{font-size:12px; color:var(--muted)}
.tdoc button.on{color:var(--accent); font-weight:600}
.dot{width:7px; height:7px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.15)}

.doc h3{margin:0 0 3px; font-size:17px; font-weight:650; letter-spacing:-.01em}
.doc .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); margin-bottom:9px}
.doc .body{white-space:pre-wrap; font-size:13.5px; line-height:1.7}
.doc .body ul{margin:6px 0; padding-left:18px}
.doc .when{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);
  font-family:var(--mono); font-size:11px; color:var(--faint)}
.empty{color:var(--faint); font-size:13px; padding:26px 4px; text-align:center}

.teams{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px}
.tbox{border:1px solid var(--line); border-radius:3px; background:var(--panel-2); padding:11px 12px;
  display:flex; flex-direction:column; gap:8px}
.tbox h3{margin:0; font-size:13.5px; font-weight:650; display:flex; align-items:center; gap:7px}
.tbox h3 .lead{font-family:var(--mono); font-size:10.5px; color:var(--faint); font-weight:400}
.tbox textarea{width:100%; min-height:52px; resize:vertical; font-family:var(--sans); font-size:12.5px;
  color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:2px; padding:6px 8px}
.tbox textarea:focus{outline:2px solid var(--accent); outline-offset:1px}
.drop{border:1px dashed var(--line); border-radius:2px; padding:9px; text-align:center;
  font-size:12px; color:var(--faint); cursor:pointer; background:var(--panel)}
.drop.over{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.tbox .feed{display:flex; flex-direction:column; gap:5px; font-size:12px}
.tbox .feed .it{display:flex; gap:6px; align-items:baseline}
.tbox .feed .it .t{font-family:var(--mono); font-size:10px; color:var(--faint); flex:none}
.tbox .feed .it .x{flex:1; min-width:0; word-break:break-word}
.tbox .feed .none{color:var(--faint)}

button{font-family:var(--sans); font-size:12.5px; color:var(--ink); background:var(--panel-2);
  border:1px solid var(--line); border-radius:2px; padding:6px 11px; cursor:pointer}
button:hover{border-color:var(--accent); color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.primary:hover{filter:brightness(1.08); color:#fff}
.row{display:flex; gap:7px; flex-wrap:wrap; align-items:center}

.rule{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:13px; align-items:baseline}
.rule dt{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.rule dd{margin:0}
.chipset{display:flex; flex-wrap:wrap; gap:4px; margin-top:2px}
.chipset span{font-family:var(--mono); font-size:11px; background:var(--accent-soft); color:var(--accent);
  padding:1px 6px; border-radius:2px}
.sep{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--accent)}
.warn{border-left:3px solid var(--st-link); padding:8px 11px; background:var(--panel-2);
  font-size:12.5px; color:var(--muted); border-radius:0 2px 2px 0}
.made{font-family:var(--mono); font-size:12px; background:var(--panel-2); border:1px solid var(--line-soft);
  border-radius:2px; padding:6px 8px; word-break:break-all}
.made + .made{margin-top:4px}
footer{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); border-top:1px solid var(--line); padding-top:12px;
  display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
</style>

<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <span class="eyebrow">SY COMPANY · 토리든 퍼포먼스 마케팅</span>
      <h1>자료실</h1>
    </div>
    <div class="meta" id="meta">—</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="card" id="storeWarn" style="display:none">
    <div class="warn" id="storeWarnText"></div>
  </div>

  <section class="card">
    <h2>수집 자료 · 팀 › 직원 › 업무 제목</h2>
    <div class="browser">
      <div class="tree" id="tree"></div>
      <div class="doc" id="doc"></div>
    </div>
  </section>

  <section class="card">
    <h2>네이밍팀 구분자</h2>
    <div id="naming"></div>
  </section>

  <section class="card">
    <h2>팀별 업무 지시 · 파일 투입구</h2>
    <div class="teams" id="teams"></div>
  </section>

  <section class="card">
    <h2>데이터</h2>
    <div class="row">
      <button id="btnExport">내보내기 (JSON)</button>
      <button id="btnImport">불러오기</button>
      <input type="file" id="importFile" accept=".json" hidden>
      <button id="btnClear">자료 비우기</button>
      <span class="meta" id="dataNote" style="font-family:var(--mono); font-size:11px; color:var(--faint)"></span>
    </div>
  </section>

  <footer>
    <span>사무실 시뮬레이터와 같은 브라우저 저장소를 씁니다</span>
    <span id="savedAt">—</span>
  </footer>
</div>

<script>
"use strict";
/* ── SY COMPANY 공용 저장소 ─────────────────────────────────────
   사무실 시뮬레이터와 자료실 사이트가 같은 브라우저 저장소를 함께 쓴다.
   저장소를 쓸 수 없는 환경(사생활 보호 모드 등)에서는 메모리로만 동작하고,
   그 사실을 화면에 알린다. */
const STORE_KEY = "sy-company-v2";
const STORE_EMPTY = () => ({
  v: 2, savedAt: Date.now(),
  sim: null,                 // 시뮬레이터 진행 상태
  archive: [],               // 직원들이 쌓은 자료 (팀 > 직원 > 업무 제목)
  inbox: {},                 // 팀별 업무 지시(텍스트)와 파일
  naming: null,              // 네이밍팀이 학습한 구분자
  patterns: null             // 성과리뷰팀에 전달된 패턴 자료
});

let STORE_OK = true;
try {
  localStorage.setItem(STORE_KEY + "-probe", "1");
  localStorage.removeItem(STORE_KEY + "-probe");
} catch (e) { STORE_OK = false; }

let memStore = null;

function storeLoad(){
  if (!STORE_OK) return memStore || (memStore = STORE_EMPTY());
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return STORE_EMPTY();
    const o = JSON.parse(raw);
    return (o && o.v === 2) ? o : STORE_EMPTY();
  } catch (e) { return STORE_EMPTY(); }
}

function storeSave(o){
  o.savedAt = Date.now();
  if (!STORE_OK){ memStore = o; return false; }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); return true; }
  catch (e) { return false; }          // 용량 초과 등
}

function storePatch(fn){
  const o = storeLoad();
  fn(o);
  storeSave(o);
  return o;
}

/* 다른 탭에서 바뀌면 알려준다 (같은 브라우저에서 두 페이지를 함께 열 때) */
function storeOnChange(fn){
  addEventListener("storage", e => { if (e.key === STORE_KEY) fn(storeLoad()); });
}

const fmtWhen = ms => {
  const d = new Date(ms), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const fmtAgo = ms => {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return "방금";
  if (s < 3600) return `${Math.floor(s/60)}분 전`;
  if (s < 86400) return `${Math.floor(s/3600)}시간 전`;
  return `${Math.floor(s/86400)}일 전`;
};

/* ── 엑셀(.xlsx) 최소 판독기 ────────────────────────────────────
   외부 라이브러리를 못 쓰는 환경이라, xlsx(=zip)를 직접 푼다.
   중앙 디렉터리를 읽어 필요한 XML 두 개만 꺼내 쓴다. */
async function readXlsx(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer);
  // End of Central Directory 찾기
  let eocd = -1;
  for (let i = buf.length - 22; i >= 0 && i > buf.length - 66000; i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("엑셀 파일 형식이 아닙니다.");
  const count = dv.getUint16(eocd + 10, true);
  let ptr = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let n = 0; n < count; n++){
    if (dv.getUint32(ptr, true) !== 0x02014b50) break;
    const method = dv.getUint16(ptr + 10, true);
    const csize = dv.getUint32(ptr + 20, true);
    const nameLen = dv.getUint16(ptr + 28, true);
    const extraLen = dv.getUint16(ptr + 30, true);
    const cmtLen = dv.getUint16(ptr + 32, true);
    const lho = dv.getUint32(ptr + 42, true);
    const name = new TextDecoder().decode(buf.subarray(ptr + 46, ptr + 46 + nameLen));
    files[name] = { method, csize, lho };
    ptr += 46 + nameLen + extraLen + cmtLen;
  }
  async function extract(name){
    const f = files[name];
    if (!f) return null;
    const ln = dv.getUint16(f.lho + 26, true), le = dv.getUint16(f.lho + 28, true);
    const start = f.lho + 30 + ln + le;
    const raw = buf.subarray(start, start + f.csize);
    if (f.method === 0) return new TextDecoder().decode(raw);
    const ds = new DecompressionStream("deflate-raw");
    const stream = new Blob([raw]).stream().pipeThrough(ds);
    return new TextDecoder().decode(new Uint8Array(await new Response(stream).arrayBuffer()));
  }
  const sharedXml = await extract("xl/sharedStrings.xml");
  const shared = [];
  if (sharedXml){
    const doc = new DOMParser().parseFromString(sharedXml, "application/xml");
    doc.querySelectorAll("si").forEach(si => {
      shared.push([...si.querySelectorAll("t")].map(t => t.textContent).join(""));
    });
  }
  let sheetName = Object.keys(files).find(n => /^xl\/worksheets\/sheet1\.xml$/.test(n))
               || Object.keys(files).find(n => /^xl\/worksheets\/.*\.xml$/.test(n));
  const sheetXml = sheetName ? await extract(sheetName) : null;
  if (!sheetXml) throw new Error("시트를 찾지 못했습니다.");
  const doc = new DOMParser().parseFromString(sheetXml, "application/xml");
  const rows = [];
  doc.querySelectorAll("row").forEach(r => {
    const cells = [];
    r.querySelectorAll("c").forEach(c => {
      const ref = (c.getAttribute("r") || "").replace(/[0-9]/g, "");
      let col = 0;
      for (const ch of ref) col = col * 26 + (ch.charCodeAt(0) - 64);
      col = Math.max(1, col) - 1;
      const t = c.getAttribute("t");
      let v = "";
      if (t === "inlineStr") v = c.querySelector("is t")?.textContent ?? "";
      else {
        const raw = c.querySelector("v")?.textContent ?? "";
        v = (t === "s") ? (shared[+raw] ?? "") : raw;
      }
      while (cells.length < col) cells.push("");
      cells[col] = v;
    });
    rows.push(cells);
  });
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}

/* CSV/TSV도 같은 모양으로 읽는다 */
async function readDelimited(file){
  const text = await file.text();
  const sep = text.includes("\t") ? "\t" : ",";
  return text.split(/\r?\n/).map(l => l.split(sep).map(c => c.replace(/^"|"$/g, "").trim()))
             .filter(r => r.some(c => c !== ""));
}

async function readTable(file){
  if (/\.xlsx$/i.test(file.name)) return readXlsx(file);
  if (/\.(csv|tsv|txt)$/i.test(file.name)) return readDelimited(file);
  throw new Error("xlsx · csv · tsv 파일만 읽을 수 있어요.");
}

/* ── 구분자 학습 ────────────────────────────────────────────────
   표에서 이름 열을 찾아, 토큰을 나누는 데 실제로 쓰인 구분 문자를 센다.
   가장 많이 쓰인 문자를 구분자로 삼고, 자리별 토큰 사전을 만든다. */
function learnNaming(rows){
  const CAND = ["_", "-", "|", "/", "·", ".", "+", "@", "#", "~", ":", ";"];
  const flat = rows.flat().map(v => String(v).trim()).filter(v => v.length > 3);
  const score = {};
  CAND.forEach(c => { score[c] = 0; });
  for (const v of flat){
    for (const c of CAND){
      const n = v.split(c).length - 1;
      if (n >= 2) score[c] += n;          // 2번 이상 나와야 구분자로 본다
    }
  }
  const sep = Object.keys(score).sort((a, b) => score[b] - score[a])[0];
  if (!sep || score[sep] === 0) return null;

  const samples = flat.filter(v => v.split(sep).length >= 3);
  if (!samples.length) return null;
  const width = Math.round(samples.reduce((s, v) => s + v.split(sep).length, 0) / samples.length);
  const slots = [];
  for (let i = 0; i < width; i++){
    const vals = [...new Set(samples.map(v => v.split(sep)[i]).filter(Boolean))];
    slots.push(vals.slice(0, 40));
  }
  return { sep, width, slots, samples: samples.slice(0, 5), learnedAt: Date.now() };
}

/* 학습한 규칙으로 이름을 만든다 */
function makeName(naming, seedParts){
  if (!naming) return null;
  const out = [];
  for (let i = 0; i < naming.width; i++){
    const given = seedParts && seedParts[i];
    const pool = naming.slots[i] || [];
    out.push(given || pool[Math.floor(Math.random() * pool.length)] || "");
  }
  return out.filter(Boolean).join(naming.sep);
}

const ROSTER = {"teams":[{"team":"시장조사팀","members":[{"name":"한지운","code":"레이더","job":"출처 검증·최종 판단","detail":"팀원이 서칭한 모든 내용 오류 없게 검증"},{"name":"서민재","code":null,"job":"뉴스 수집","detail":"MZ·20대 타겟 유행하는 밈 조사"},{"name":"오하늘","code":null,"job":"동향 조사","detail":"한국 뷰티 브랜드 '기초 제품' 중심 타사 동향 조사"}]},{"team":"브랜드 분석팀","members":[{"name":"정세라","code":"나침반","job":"페르소나 적합성","detail":"토리든 페르소나에 맞는지 최종 판단"},{"name":"김도윤","code":null,"job":"지표 분석","detail":"계정 통계 기반 지표 분석"},{"name":"배유진","code":null,"job":"페르소나 검증","detail":"기초 제품에 관심이 높은 2040 여성"}]},{"team":"기획 1팀","members":[{"name":"문태현","code":"스파크","job":"아이디어 총괄","detail":"국내 뷰티 브랜드 '토리든'의 퍼포먼스 광고 아이디어"},{"name":"이나윤","code":null,"job":"기존 제품 광고 문안","detail":"토리든 다이브인 세럼·마스크·수딩크림·선크림"},{"name":"강준서","code":null,"job":"신규 제품 광고 문안","detail":"인텐시브 장벽 크림·토너·랩핑마스크"}]},{"team":"검수팀","members":[{"name":"백승호","code":"필터","job":"최종 반려 결정","detail":"팀원이 서칭한 모든 내용 오류 없게 검증"},{"name":"윤가온","code":null,"job":"중복·근거 검사","detail":"이슈가 될 만한 부분이 있는지 검사"},{"name":"신예린","code":null,"job":"톤 검수","detail":"토리든 톤에 어울리는지 검사"}]},{"team":"기획 2팀","members":[{"name":"조민우","code":"펜촉","job":"아이디어 총괄","detail":"퍼포먼스 광고 아이디어 '10-20 타겟 / 성분흡수 포지셔닝 소재'"},{"name":"하시윤","code":null,"job":"광고 문안","detail":"10-20대 타겟 전용 신규 소재 발굴"},{"name":"권보라","code":null,"job":"광고 문안","detail":"'성분흡수' 포지셔닝 고효율 소재 발굴"}]},{"team":"네이밍팀","members":[{"name":"유가람","code":"팔레트","job":"검증·최종 판단","detail":"캠페인명·소재명 오류 없는지 검증"},{"name":"박선우","code":null,"job":"광고 소재명","detail":"학습된 구분자로 광고 소재명 제작 (신규 엑셀 넣기 전까지 구분자 유지)"},{"name":"고은채","code":null,"job":"광고 캠페인명","detail":"학습된 구분자로 광고 캠페인명 제작 (신규 엑셀 넣기 전까지 구분자 유지)"}]},{"team":"협업 소통팀","members":[{"name":"심우재","code":"브릿지","job":"협업 적합성 판단","detail":"들어온 제안이 토리든 결에 맞는지 판단"},{"name":"노아린","code":null,"job":"답장 초안","detail":"발송하지 않고 초안까지만 준비"}]},{"team":"성과리뷰팀","members":[{"name":"구다인","code":"돋보기","job":"학습점 도출","detail":"양지호에게 전달받은 지표 확인 후 학습점 도출"},{"name":"양지호","code":null,"job":"지표 수집","detail":"안하람에게 전달받은 패턴 정리 지표 수집"},{"name":"안하람","code":null,"job":"패턴 정리","detail":"엑셀 파일 전달 시 패턴 수집 후 양지호에게 넘김"}]},{"team":"자동화 운영","members":[{"name":"진성재","code":"톱니","job":"연동·재시도","detail":"끊긴 연결 재시도, 안 되는 건 안 된다고 기록"},{"name":"도경민","code":null,"job":"모니터링","detail":"연동 상태 주기 확인"}]},{"team":"비서실","members":[{"name":"은수현","code":"메트로놈","job":"전사 브리핑","detail":"병목 하나를 짚어 대표에게 보고"},{"name":"표지우","code":null,"job":"보고 취합","detail":"10개 팀 보고 취합"}]}],"staff":27,"leads":10};

const TEAMS = ROSTER.teams;                        // [{team, members:[{name, code, job, detail}]}]
const STATE_COLOR = {"완료":"--st-done","진행 중":"--st-work","승인 대기":"--st-appr","연동 대기":"--st-link","대기":"--faint"};

let S = storeLoad();
let sel = null;                                    // 선택한 자료 id
const draft = {};                                  // 팀별로 쓰던 지시 (다시 그려도 안 날아가게)
let lastSig = "";                                  // 투입구가 실제로 바뀌었을 때만 다시 그린다
let open = new Set(TEAMS.map(t => t.team));        // 펼친 팀

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "");

function entriesOf(team, name){
  return (S.archive || []).filter(e => e.team === team && e.member === name)
                          .sort((a,b) => b.at - a.at);
}
function memberState(name){
  return (S.sim && S.sim.states && S.sim.states[name]) || "대기";
}

/* ── 통계 ── */
function renderStats(){
  const n = (S.archive || []).length;
  const members = TEAMS.reduce((s,t) => s + t.members.length, 0);
  const notes = Object.values(S.inbox || {}).reduce((s,b) => s + (b.notes?.length || 0), 0);
  const files = Object.values(S.inbox || {}).reduce((s,b) => s + (b.files?.length || 0), 0);
  $("stats").innerHTML = `
    <div class="stat"><div class="k">수집 자료</div><div class="v">${n}<small>건</small></div></div>
    <div class="stat"><div class="k">팀</div><div class="v">${TEAMS.length}<small>개</small></div></div>
    <div class="stat"><div class="k">직원</div><div class="v">${members}<small>명</small></div></div>
    <div class="stat"><div class="k">받은 지시</div><div class="v">${notes}<small>건</small></div></div>
    <div class="stat"><div class="k">받은 파일</div><div class="v">${files}<small>개</small></div></div>`;
  $("meta").textContent = S.sim
    ? `사무실 ${S.sim.stepNo || ""} ${S.sim.stepName || ""} · ${S.sim.clock || ""}`
    : "사무실 시뮬레이터 기록 없음";
  $("savedAt").textContent = S.savedAt ? `마지막 갱신 ${fmtWhen(S.savedAt)}` : "—";
}

/* ── 카테고리 나무: 팀 › 직원 › 업무 제목 ── */
function renderTree(){
  const t = $("tree");
  t.innerHTML = "";
  TEAMS.forEach(tm => {
    const total = tm.members.reduce((s,m) => s + entriesOf(tm.team, m.name).length, 0);
    const wrap = document.createElement("div");
    wrap.className = "tteam";
    const head = document.createElement("button");
    head.className = "trow";
    head.innerHTML = `<span class="car">${open.has(tm.team) ? "▼" : "▶"}</span>
      <span class="nm">${esc(tm.team)}</span><span class="ct">${total}</span>`;
    head.onclick = () => { open.has(tm.team) ? open.delete(tm.team) : open.add(tm.team); renderTree(); };
    wrap.appendChild(head);
    if (open.has(tm.team)){
      tm.members.forEach(m => {
        const list = entriesOf(tm.team, m.name);
        const mem = document.createElement("div");
        mem.className = "tmem";
        const st = memberState(m.name);
        const mb = document.createElement("button");
        mb.className = "trow";
        mb.innerHTML = `<span class="dot" style="background:var(${STATE_COLOR[st] || "--faint"})"
            title="${esc(st)}"></span>
          <span class="nm">${esc(m.name)}<span class="role">${esc(m.job)}</span></span>
          <span class="ct">${list.length}</span>`;
        mb.onclick = () => {
          sel = list.length ? list[0].id : {team: tm.team, member: m.name};
          renderDoc();
        };
        mem.appendChild(mb);
        list.forEach(e => {
          const d = document.createElement("div");
          d.className = "tdoc";
          const b = document.createElement("button");
          b.className = "trow" + (sel === e.id ? " on" : "");
          b.innerHTML = `<span class="nm">${esc(e.title)}</span>
            <span class="ct">${fmtAgo(e.at)}</span>`;
          b.onclick = () => { sel = e.id; renderTree(); renderDoc(); };
          if (sel === e.id) b.classList.add("on");
          d.appendChild(b);
          mem.appendChild(d);
        });
        wrap.appendChild(mem);
      });
    }
    t.appendChild(wrap);
  });
}

function renderDoc(){
  const d = $("doc");
  if (sel && typeof sel === "object"){
    const tm = TEAMS.find(t => t.team === sel.team);
    const m = tm && tm.members.find(x => x.name === sel.member);
    d.innerHTML = `<div class="crumb">${esc(sel.team)} › ${esc(sel.member)}</div>
      <h3>${esc(m ? m.job : "")}</h3>
      <div class="body">${esc(m ? m.detail : "")}</div>
      <div class="when">아직 쌓인 자료가 없습니다. 사무실 시뮬레이터를 돌리면 이 사람이 만든 자료가 여기에 들어옵니다.</div>`;
    return;
  }
  const e = (S.archive || []).find(x => x.id === sel);
  if (!e){
    d.innerHTML = `<div class="empty">왼쪽에서 팀·직원·업무를 고르면 내용이 여기 나옵니다.</div>`;
    return;
  }
  const lines = String(e.body || "").split("\n").filter(Boolean);
  d.innerHTML = `<div class="crumb">${esc(e.team)} › ${esc(e.member)} › ${esc(e.step || "")}</div>
    <h3>${esc(e.title)}</h3>
    <div class="body">${lines.map(l => esc(l)).join("<br>")}</div>
    <div class="when">${fmtWhen(e.at)} · ${fmtAgo(e.at)}</div>`;
}

/* ── 네이밍 구분자 ── */
function renderNaming(){
  const n = S.naming, el = $("naming");
  if (!n){
    el.innerHTML = `<div class="warn">
      아직 구분자 파일을 못 받았습니다. 대표가 준 엑셀에는 인원 편성표만 있고 캠페인명·소재명 예시가 없어서,
      학습할 구분자를 찾지 못했습니다. 아래 <b>네이밍팀 투입구</b>에 캠페인명·소재명이 들어 있는
      엑셀(xlsx)이나 CSV를 넣어주세요. 그 전까지 박선우·고은채는 '연동 대기'로 멈춰 있습니다.
    </div>`;
    return;
  }
  const sample = [makeName(n), makeName(n), makeName(n)].filter(Boolean);
  el.innerHTML = `
    <dl class="rule">
      <dt>구분자</dt><dd><span class="sep">${esc(n.sep)}</span></dd>
      <dt>자리 수</dt><dd>${n.width}칸</dd>
      <dt>출처</dt><dd>${esc(n.fileName || "—")} · ${fmtWhen(n.learnedAt)}</dd>
    </dl>
    <div style="margin-top:11px">
      ${n.slots.map((s,i) => `<div style="margin-bottom:6px">
        <div class="k" style="font-family:var(--mono); font-size:10px; letter-spacing:.12em;
             text-transform:uppercase; color:var(--faint)">${i+1}번째 칸 · ${s.length}종</div>
        <div class="chipset">${s.slice(0,12).map(v => `<span>${esc(v)}</span>`).join("")}
        ${s.length > 12 ? `<span>+${s.length-12}</span>` : ""}</div></div>`).join("")}
    </div>
    <div style="margin-top:12px">
      <div class="k" style="font-family:var(--mono); font-size:10px; letter-spacing:.12em;
           text-transform:uppercase; color:var(--faint); margin-bottom:5px">이 규칙으로 만든 예시</div>
      ${sample.map(s => `<div class="made">${esc(s)}</div>`).join("")}
    </div>
    <div class="warn" style="margin-top:12px">새 엑셀을 넣기 전까지 이 구분자를 그대로 유지합니다.</div>`;
}

/* ── 팀별 투입구 ── */
function inboxOf(team){
  S.inbox = S.inbox || {};
  S.inbox[team] = S.inbox[team] || {notes: [], files: []};
  return S.inbox[team];
}

function renderTeams(){
  const wrap = $("teams");
  wrap.innerHTML = "";
  TEAMS.forEach(tm => {
    const box = inboxOf(tm.team);
    const lead = tm.members.find(m => m.code);
    const el = document.createElement("div");
    el.className = "tbox";
    el.innerHTML = `
      <h3>${esc(tm.team)}<span class="lead">${lead ? esc(lead.name) + " · " + esc(lead.code) : ""}</span></h3>
      <textarea placeholder="업무 지시를 적어주세요"></textarea>
      <div class="row"><button class="primary send">지시 전달</button></div>
      <div class="drop">파일을 끌어다 놓거나 눌러서 선택 (xlsx · csv · txt)</div>
      <div class="feed"></div>`;
    const ta = el.querySelector("textarea");
    ta.value = draft[tm.team] || "";
    ta.oninput = () => { draft[tm.team] = ta.value; };
    el.querySelector(".send").onclick = () => {
      const v = ta.value.trim();
      if (!v) return;
      storePatch(o => {
        o.inbox = o.inbox || {};
        o.inbox[tm.team] = o.inbox[tm.team] || {notes: [], files: []};
        o.inbox[tm.team].notes.unshift({text: v, at: Date.now(), read: false});
      });
      ta.value = ""; draft[tm.team] = "";
      refresh();
    };
    const drop = el.querySelector(".drop");
    const pick = document.createElement("input");
    pick.type = "file"; pick.hidden = true;
    pick.accept = ".xlsx,.csv,.tsv,.txt";
    el.appendChild(pick);
    drop.onclick = () => pick.click();
    pick.onchange = () => pick.files[0] && takeFile(tm.team, pick.files[0]);
    ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.add("over");
    }));
    ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.remove("over");
    }));
    drop.addEventListener("drop", e => {
      const f = e.dataTransfer.files[0];
      if (f) takeFile(tm.team, f);
    });
    const feed = el.querySelector(".feed");
    const items = [...box.notes.map(n => ({...n, kind:"지시"})),
                   ...box.files.map(f => ({...f, kind:"파일", text: f.name}))]
                  .sort((a,b) => b.at - a.at).slice(0, 5);
    feed.innerHTML = items.length
      ? items.map(i => `<div class="it"><span class="t">${i.kind}</span>
          <span class="x">${esc(i.text)}${i.note ? " — " + esc(i.note) : ""}</span>
          <span class="t">${fmtAgo(i.at)}</span></div>`).join("")
      : `<div class="none">아직 받은 지시나 파일이 없습니다.</div>`;
    wrap.appendChild(el);
  });
}

async function takeFile(team, file){
  let note = "", rows = null;
  try {
    if (/\.(xlsx|csv|tsv)$/i.test(file.name)){
      rows = await readTable(file);
      note = `${rows.length}행 읽음`;
    } else {
      const t = await file.text();
      note = `${t.split(/\r?\n/).length}줄`;
    }
  } catch (e) { note = "읽지 못함 — " + e.message; }

  let learned = null, patterns = null;
  if (rows && team === "네이밍팀"){
    learned = learnNaming(rows);
    note += learned ? ` · 구분자 "${learned.sep}" 학습` : " · 구분자를 찾지 못함";
  }
  if (rows && team === "성과리뷰팀"){
    patterns = {fileName: file.name, rows: rows.length, at: Date.now()};
    note += " · 패턴 자료 접수";
  }

  storePatch(o => {
    o.inbox = o.inbox || {};
    o.inbox[team] = o.inbox[team] || {notes: [], files: []};
    o.inbox[team].files.unshift({name: file.name, size: file.size, at: Date.now(), note, read: false});
    if (learned) o.naming = {...learned, fileName: file.name};
    if (patterns) o.patterns = patterns;
  });
  refresh();
}

/* ── 데이터 ── */
$("btnExport").onclick = async () => {
  const data = JSON.stringify(storeLoad(), null, 2);
  const name = "sy-company-자료실.json";
  if (window.claude && window.claude.downloads){
    try { await window.claude.downloads.save({filename: name, data}); return; }
    catch (e) { $("dataNote").textContent = "저장이 취소됐습니다."; return; }
  }
  $("dataNote").textContent = "이 환경에서는 파일 저장을 쓸 수 없습니다.";
};
$("btnImport").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (!o || o.v !== 2) throw new Error("형식이 맞지 않습니다");
    storeSave(o);
    $("dataNote").textContent = "불러왔습니다.";
    refresh();
  } catch (err) { $("dataNote").textContent = "불러오지 못했습니다 — " + err.message; }
};
$("btnClear").onclick = () => {
  if (!confirm("쌓인 자료와 받은 지시를 모두 지웁니다. 사무실 진행 상태는 그대로 둡니다.")) return;
  storePatch(o => { o.archive = []; o.inbox = {}; });
  sel = null;
  refresh();
};

function refresh(){
  S = storeLoad();
  renderStats(); renderTree(); renderDoc(); renderNaming();
  const sig = JSON.stringify(S.inbox || {}) + "|" + JSON.stringify(S.naming || null);
  if (sig !== lastSig){ lastSig = sig; renderTeams(); }
}

if (!STORE_OK){
  $("storeWarn").style.display = "";
  $("storeWarnText").textContent =
    "이 브라우저에서는 저장소를 쓸 수 없어, 이 페이지를 닫으면 내용이 사라집니다. " +
    "내보내기로 파일을 받아두시면 다음에 불러올 수 있습니다.";
}
storeOnChange(() => refresh());
addEventListener("focus", refresh);
refresh();
</script>
